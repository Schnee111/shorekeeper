# prometheus.yaml — scrape config Shorekeeper (TASK-3.1).
# Sumber metric: otel-collector prometheus exporter (shorekeeper namespace).
global:
  scrape_interval: 2s
  evaluation_interval: 5s

scrape_configs:
  - job_name: shorekeeper-otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: shorekeeper-orchestrator
